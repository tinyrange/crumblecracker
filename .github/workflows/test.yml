name: Product checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./internal/core/cmd/build-guestinit
      - name: Test product behavior
        run: go test -short ./internal/desktopapp ./internal/runtime ./internal/ptyterm ./internal/hostcompat ./internal/core/virtio ./internal/core/virgl ./internal/core/oci ./internal/core/cmd/init ./internal/core/kernel/alpine ./internal/core/vm/mounts ./internal/core/netstack -count=1 -timeout 3m
      - name: Build Linux apps
        run: CGO_ENABLED=0 go build ./cmd/squadvm ./cmd/ndappx
  additional-platforms:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./internal/core/cmd/build-guestinit
      - name: Test product behavior
        run: go test -short ./internal/desktopapp ./internal/runtime ./internal/ptyterm ./internal/hostcompat ./internal/core/virtio ./internal/core/virgl ./internal/core/oci ./internal/core/cmd/init ./internal/core/kernel/alpine ./internal/core/vm/mounts ./internal/core/netstack -count=1 -timeout 3m
      - name: Build native apps
        run: go build ./cmd/squadvm ./cmd/ndappx
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./internal/core/cmd/build-guestinit
      - name: Test native GPU and app lifecycle
        run: go test -short ./internal/core/virgl ./internal/runtime ./internal/desktopapp -count=1 -timeout 3m
      - run: CGO_ENABLED=0 go build ./cmd/squadvm ./cmd/ndappx
